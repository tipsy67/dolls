<section class="section block-testimonials block-testimonials-2">
    <div class="container">
        <div class="text-center wow bounceIn">
            <p class="text-17-medium text-uppercase mb-15 primary-navy">ОТЗЫВЫ</p>
            <h3 class="neutral-dark mb-40 wow fadeInLeft">Что говорят клиенты</h3>
        </div>
        <div class="box-slide-customers wow fadeInUp">
            <div class="box-swiper">
                <div class="swiper-container swiper-banner">
                    <div class="swiper-wrapper">
                        {% for obj in testimonial_list %}
                            <div class="swiper-slide">
                                <p class="text-italic-28 mb-30">
                                    {{ obj.message }}
                                </p>
                                <p class="text-16-medium">{{ obj.name }}</p>
                            </div>
                        {% endfor %}
                    </div>
                    <div class="box-pagination-button">
                        <div class="swiper-pagination swiper-pagination-banner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
