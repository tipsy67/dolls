services:

  redis:
    image: redis:latest
    restart: on-failure
    expose:
      - "6379"

  db:
    image: "postgres:latest"
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER" ]
      interval: 10s
      retries: 50
      timeout: 5s
    restart: on-failure

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: on-failure
    env_file:
      - .env
    volumes:
      - .:/app
#      - static:/app/staticfiles
#      - media:/app/media
    command: sh -c "./entrypoint.sh"
#    stdin_open: true
#    tty: true
#    command: bash

  celery:
    build: .
    depends_on:
      - redis
      - db
      - app
    restart: on-failure
    env_file:
      - .env
    volumes:
      - .:/app
    command: celery -A config worker -l info

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/app
    depends_on:
      - app

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "5050:80"
    volumes:
      - pg_admin:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  flower:
    build: .
    ports:
      - "${FLOWER_PORT}:${FLOWER_PORT}"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - celery
      - redis
    command: >
      celery -A config flower
      --port=${FLOWER_PORT}
      --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
      --broker=${FLOWER_BROKER_URL}


volumes:
  pg_data:
  pg_admin:
#  static:
#  media:
